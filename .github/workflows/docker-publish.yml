name: CI/CD Pipeline - Build and Push Docker Images

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: |
          frontend/package-lock.json
          backend/package-lock.json

    - name: Install Frontend Dependencies & Lint
      run: |
        cd frontend
        npm ci
        npm run lint

    - name: Build Frontend
      run: |
        cd frontend
        npm run build

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # Automatically fallback if GitHub Secrets haven't been configured yet
    - name: Determine Docker Namespace
      id: vars
      run: |
        if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ]; then
          echo "namespace=${{ secrets.DOCKERHUB_USERNAME }}" >> $GITHUB_OUTPUT
          echo "has_secrets=true" >> $GITHUB_OUTPUT
        else
          echo "namespace=local-build" >> $GITHUB_OUTPUT
          echo "has_secrets=false" >> $GITHUB_OUTPUT
        fi

    - name: Log in to Docker Hub
      if: github.event_name != 'pull_request' && steps.vars.outputs.has_secrets == 'true'
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Backend Image
      uses: docker/build-push-action@v5
      with:
        context: ./backend
        # Only push to registry if we aren't a PR AND we actually have secrets set up
        push: ${{ github.event_name != 'pull_request' && steps.vars.outputs.has_secrets == 'true' }}
        tags: |
          ${{ steps.vars.outputs.namespace }}/charity-backend:latest
          ${{ steps.vars.outputs.namespace }}/charity-backend:${{ github.sha }}

    - name: Build and Push Frontend Image
      uses: docker/build-push-action@v5
      with:
        context: ./frontend
        push: ${{ github.event_name != 'pull_request' && steps.vars.outputs.has_secrets == 'true' }}
        tags: |
          ${{ steps.vars.outputs.namespace }}/charity-frontend:latest
          ${{ steps.vars.outputs.namespace }}/charity-frontend:${{ github.sha }}
